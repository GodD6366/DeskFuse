<?xml version="1.0" encoding="UTF-8"?>
<!-- DMG 安装窗口背景：920×560 逻辑点。图标中心与 scripts/package-macos.sh 中的
     Finder 布局保持一致：DeskFuse.app (250, 262)，Applications (670, 262)。
     底部约 40 pt 可能被窗口标题栏高度差裁掉，不放置关键内容。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F6F2"/>
      <stop offset="1" stop-color="#EFECE6"/>
    </linearGradient>
    <filter id="padShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <rect id="pad" width="184" height="200" rx="32"/>
  </defs>

  <rect width="920" height="560" fill="url(#canvas)"/>

  <!-- 标题 -->
  <text x="460" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.4" fill="#202226">DeskFuse</text>
  <text x="460" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" fill="#6E6A63">在多台电脑间共享剪贴板、文件和键鼠</text>

  <!-- 图标落位卡片：中心分别为 (250, 262) 与 (670, 262)，留出标签空间。 -->
  <g>
    <use href="#pad" x="158" y="168" transform="translate(0 8)" fill="#3A332A" opacity=".08" filter="url(#padShadow)"/>
    <use href="#pad" x="158" y="168" fill="#FFFFFF" fill-opacity=".85" stroke="#E2DED6"/>
    <use href="#pad" x="578" y="168" transform="translate(0 8)" fill="#3A332A" opacity=".08" filter="url(#padShadow)"/>
    <use href="#pad" x="578" y="168" fill="#FFFFFF" fill-opacity=".85" stroke="#E2DED6"/>
  </g>

  <!-- 应用入口与手动安装备用路径。 -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M372 262H540" stroke="#C9C4BA" stroke-width="4" stroke-dasharray="1 14"/>
    <path d="M526 248L544 262L526 276" stroke="#F2582A" stroke-width="4"/>
  </g>

  <!-- 操作说明 -->
  <text x="460" y="414" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#2E2C29">双击 DeskFuse，点击安装即可开始</text>
  <text x="460" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#6E6A63">Double-click DeskFuse, then click Install</text>
  <text x="460" y="476" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#8D877E">也可拖入「应用程序」手动安装 · Or drag into Applications</text>
</svg>
