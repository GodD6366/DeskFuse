<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>uniDesk — Connected windows</title>
  <desc>Two interlocking blue and cyan windows on an ice-white macOS tile. The shared opening represents one continuous workspace across devices. Original editable vector artwork, paired with a dedicated monochrome menu bar glyph.</desc>
  <defs>
    <linearGradient id="tile" x1="302" y1="104" x2="700" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".46" stop-color="#F7FAFF"/><stop offset="1" stop-color="#E1EAF5"/>
    </linearGradient>
    <linearGradient id="tileRim" x1="512" y1="104" x2="512" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#DCE5EF"/><stop offset="1" stop-color="#AFBFD3"/>
    </linearGradient>
    <linearGradient id="rear" x1="252" y1="292" x2="583" y2="543" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3E5"/><stop offset=".5" stop-color="#0FAEE6"/><stop offset="1" stop-color="#0873D9"/>
    </linearGradient>
    <linearGradient id="front" x1="445" y1="448" x2="779" y2="713" gradientUnits="userSpaceOnUse">
      <stop stop-color="#238EFF"/><stop offset=".46" stop-color="#1769ED"/><stop offset="1" stop-color="#244BCC"/>
    </linearGradient>
    <linearGradient id="rearGlass" x1="297" y1="339" x2="538" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2FAFF"/><stop offset="1" stop-color="#C6EAFA"/>
    </linearGradient>
    <linearGradient id="frontGlass" x1="486" y1="496" x2="729" y2="659" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF7FF"/><stop offset="1" stop-color="#C5DAFA"/>
    </linearGradient>
    <path id="tileShape" d="M309 104H715C789 104 837 121 871 155C905 189 920 237 920 311V713C920 787 905 835 871 869C837 903 789 920 715 920H309C235 920 187 903 153 869C119 835 104 787 104 713V311C104 237 119 189 153 155C187 121 235 104 309 104Z"/>
    <path id="rearFrame" fill-rule="evenodd" d="M304 284H530C567.6 284 598 314.4 598 352V486C598 523.6 567.6 554 530 554H304C266.4 554 236 523.6 236 486V352C236 314.4 266.4 284 304 284ZM305 330C292.3 330 282 340.3 282 353V485C282 497.7 292.3 508 305 508H529C541.7 508 552 497.7 552 485V353C552 340.3 541.7 330 529 330H305Z"/>
    <path id="frontFrame" fill-rule="evenodd" d="M494 446H720C757.6 446 788 476.4 788 514V648C788 685.6 757.6 716 720 716H494C456.4 716 426 685.6 426 648V514C426 476.4 456.4 446 494 446ZM495 492C482.3 492 472 502.3 472 515V647C472 659.7 482.3 670 495 670H719C731.7 670 742 659.7 742 647V515C742 502.3 731.7 492 719 492H495Z"/>
    <clipPath id="frontInk"><use href="#frontFrame"/></clipPath>
    <clipPath id="crossing"><rect x="534" y="436" width="76" height="64"/></clipPath>
  </defs>
  <g id="app-tile">
    <use href="#tileShape" transform="translate(0 5)" fill="#243C5C" opacity=".12"/>
    <use href="#tileShape" fill="url(#tile)"/>
    <use href="#tileShape" stroke="url(#tileRim)" stroke-width="3"/>
  </g>
  <g id="center-mark">
    <use href="#rearFrame" transform="translate(0 10)" fill="#105C9C" opacity=".10"/>
    <use href="#frontFrame" transform="translate(0 10)" fill="#163E91" opacity=".13"/>
    <rect x="280" y="328" width="274" height="182" rx="26" fill="url(#rearGlass)"/>
    <rect x="470" y="490" width="274" height="182" rx="26" fill="url(#frontGlass)"/>
    <use href="#rearFrame" fill="url(#rear)"/>
    <use href="#frontFrame" fill="url(#front)"/>
    <path d="M304 287H530C565.9 287 595 316.1 595 352" stroke="#FFFFFF" stroke-opacity=".52" stroke-width="3" stroke-linecap="round"/>
    <path d="M494 449H720C755.9 449 785 478.1 785 514" stroke="#FFFFFF" stroke-opacity=".50" stroke-width="3" stroke-linecap="round"/>
    <!-- Alternate the two crossings so the windows interlock. The knockout is
         clipped to blue ink: no painted seams inside the translucent panes. -->
    <g clip-path="url(#crossing)">
      <g clip-path="url(#frontInk)">
        <path d="M530 531C554.9 531 575 510.9 575 486V420" stroke="#F1F8FF" stroke-width="58"/>
      </g>
      <use href="#rearFrame" fill="url(#rear)"/>
    </g>
  </g>
</svg>
