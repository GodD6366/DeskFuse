<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>DeskFuse — Screen arrangement (light)</title>
  <desc>Three screens laid edge to edge as in a real display arrangement: the remote device's screen (signal orange) at top left, this Mac's external display to its right, and the built-in display below it.</desc>
  <defs>
    <linearGradient id="tile" x1="512" y1="104" x2="512" y2="920" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFAF7"/><stop offset="1" stop-color="#E9E6E0"/></linearGradient>
    <linearGradient id="tileRim" x1="512" y1="104" x2="512" y2="920" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFCAC1"/></linearGradient>
    <linearGradient id="remoteFill" x1="0" y1="314" x2="0" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#FF7346"/><stop offset="1" stop-color="#E9491B"/></linearGradient>
    <linearGradient id="externalFill" x1="0" y1="346" x2="0" y2="552" gradientUnits="userSpaceOnUse"><stop stop-color="#3A3D44"/><stop offset="1" stop-color="#1E2024"/></linearGradient>
    <linearGradient id="builtinFill" x1="0" y1="534" x2="0" y2="704" gradientUnits="userSpaceOnUse"><stop stop-color="#3A3D44"/><stop offset="1" stop-color="#1E2024"/></linearGradient>
    <!-- 顶缘高光：只在每块屏幕上沿出现，向下迅速消失。 -->
    <linearGradient id="remoteRim" x1="0" y1="314" x2="0" y2="380" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="externalRim" x1="0" y1="346" x2="0" y2="412" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".28"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="builtinRim" x1="0" y1="534" x2="0" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".28"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="ambient" x="-30%" y="-30%" width="160%" height="190%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="contact" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="tileShape" d="M309 104H715C789 104 837 121 871 155C905 189 920 237 920 311V713C920 787 905 835 871 869C837 903 789 920 715 920H309C235 920 187 903 153 869C119 835 104 787 104 713V311C104 237 119 189 153 155C187 121 235 104 309 104Z"/>
    <!-- 屏幕排列参照实际使用：远端设备在左上，本机外接屏在右侧并略微下沉，
         本机内建屏在远端屏下方、右边缘对齐。屏幕之间只留细缝，互不重叠。 -->
    <rect id="remoteShape" x="176" y="314" width="330" height="206" rx="24"/>
    <rect id="externalShape" x="520" y="346" width="330" height="206" rx="24"/>
    <rect id="builtinShape" x="246" y="534" width="260" height="170" rx="22"/>
    <clipPath id="tileClip"><use href="#tileShape"/></clipPath>
    <clipPath id="remoteClip"><use href="#remoteShape"/></clipPath>
    <clipPath id="externalClip"><use href="#externalShape"/></clipPath>
    <clipPath id="builtinClip"><use href="#builtinShape"/></clipPath>
  </defs>
  <g id="app-tile">
    <use href="#tileShape" transform="translate(0 10)" fill="#000000" opacity=".2" filter="url(#tileShadow)"/>
    <use href="#tileShape" fill="url(#tile)"/>
    <use href="#tileShape" stroke="url(#tileRim)" stroke-width="3"/>
  </g>
  <g id="center-mark" clip-path="url(#tileClip)">
    <g transform="translate(512 530) scale(1.02) translate(-513 -509)">
      <!-- 两层投影：大范围环境阴影 + 贴近底边的接触阴影。 -->
      <use href="#remoteShape" transform="translate(0 18)" fill="#2B2318" opacity=".2" filter="url(#ambient)"/>
      <use href="#externalShape" transform="translate(0 18)" fill="#2B2318" opacity=".2" filter="url(#ambient)"/>
      <use href="#builtinShape" transform="translate(0 18)" fill="#2B2318" opacity=".2" filter="url(#ambient)"/>
      <use href="#remoteShape" transform="translate(0 2)" fill="#2B2318" opacity=".12" filter="url(#contact)"/>
      <use href="#externalShape" transform="translate(0 2)" fill="#2B2318" opacity=".12" filter="url(#contact)"/>
      <use href="#builtinShape" transform="translate(0 2)" fill="#2B2318" opacity=".12" filter="url(#contact)"/>
      <use href="#remoteShape" fill="url(#remoteFill)"/>
      <use href="#externalShape" fill="url(#externalFill)"/>
      <use href="#builtinShape" fill="url(#builtinFill)"/>
      <!-- 每块屏幕顶部一条细菜单栏，让色块读作“屏幕”。 -->
      <rect x="176" y="314" width="330" height="22" fill="#FFFFFF" opacity=".2" clip-path="url(#remoteClip)"/>
      <rect x="520" y="346" width="330" height="22" fill="#FFFFFF" opacity=".08" clip-path="url(#externalClip)"/>
      <rect x="246" y="534" width="260" height="18" fill="#FFFFFF" opacity=".08" clip-path="url(#builtinClip)"/>
      <use href="#remoteShape" stroke="url(#remoteRim)" stroke-width="3"/>
      <use href="#externalShape" stroke="url(#externalRim)" stroke-width="3"/>
      <use href="#builtinShape" stroke="url(#builtinRim)" stroke-width="3"/>
    </g>
  </g>
</svg>
