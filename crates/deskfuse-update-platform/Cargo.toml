[package]
name = "deskfuse-update-platform"
description = "Platform execution adapters for the DeskFuse updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "deskfuse_update_platform"
path = "src/lib.rs"

[[bin]]
name = "deskfuse-update-helper"
path = "src/bin/deskfuse-update-helper.rs"

[dependencies]
deskfuse-update = { path = "../deskfuse-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
semver = "1"
tempfile = "3"

[lints]
workspace = true
