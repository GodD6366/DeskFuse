[package]
name = "unidesk-platform-macos"
description = "Platform boundary for macOS permissions, pasteboard, and global input integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[lib]
name = "unidesk_platform_macos"
path = "src/lib.rs"

[features]
default = []

[dependencies]
webp = { version = "0.3.1", default-features = false }
foreign-types = "0.5"
unidesk-platform = { path = "../unidesk-platform" }
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
unidesk-core = { path = "../unidesk-core" }
unidesk-input = { path = "../unidesk-input" }
block2 = "0.6.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = { version = "0.24.0", default-features = false, features = ["link", "highsierra"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSNotification",
    "NSThread",
    "NSObjCRuntime",
    "NSOperation",
    "block2",
    "NSArray",
    "NSDictionary",
    "NSObject",
    "NSValue",
    "std",
    "NSData",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSWorkspace",
    "NSRunningApplication",
    "NSPasteboard",
    "NSPasteboardItem",
] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
