[package]
name = "unidesk-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"
unidesk-core = { path = "../unidesk-core" }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Cryptography", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell",
] }
