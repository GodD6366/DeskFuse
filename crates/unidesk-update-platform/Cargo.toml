[package]
name = "unidesk-update-platform"
description = "Platform execution adapters for the uniDesk updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "unidesk_update_platform"
path = "src/lib.rs"

[[bin]]
name = "unidesk-update-helper"
path = "src/bin/unidesk-update-helper.rs"

[dependencies]
unidesk-update = { path = "../unidesk-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
