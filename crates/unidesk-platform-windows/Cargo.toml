[package]
name = "unidesk-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
unidesk-platform = { path = "../unidesk-platform" }
unidesk-core = { path = "../unidesk-core" }
unidesk-input = { path = "../unidesk-input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.8"
png = "=0.18.1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_System_Memory", "Win32_System_DataExchange",
    "Win32_System_Threading", "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Devices_Display",
    "Win32_Security", "Win32_Globalization", "Win32_Storage_FileSystem"
] }

[lints]
workspace = true
