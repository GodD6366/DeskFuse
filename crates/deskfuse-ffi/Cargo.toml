[package]
name = "deskfuse-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
uniffi = { version = "=0.32.1", features = ["cli"] }
thiserror = "2"
serde_json = "1"
futures = "0.3"
uuid = "1"
deskfuse-input = { path = "../deskfuse-input" }
deskfuse-engine = { path = "../deskfuse-engine" }
deskfuse-store = { path = "../deskfuse-store" }
deskfuse-core = { path = "../deskfuse-core" }
deskfuse-runtime = { path = "../deskfuse-runtime" }
deskfuse-platform = { path = "../deskfuse-platform" }
deskfuse-platform-macos = { path = "../deskfuse-platform-macos" }
deskfuse-transport = { path = "../deskfuse-transport" }
deskfuse-transfer = { path = "../deskfuse-transfer" }
deskfuse-update = { path = "../deskfuse-update" }

[[bin]]
name = "deskfuse-bindgen"
path = "src/bindgen.rs"

[lints]
workspace = true
