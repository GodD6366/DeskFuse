[package]
name = "deskfuse-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
deskfuse-platform = { path = "../deskfuse-platform" }
deskfuse-core = { path = "../deskfuse-core" }
deskfuse-input = { path = "../deskfuse-input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.8"
png = "=0.18.1"
if-addrs = "=0.15.0"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_System_Memory", "Win32_System_DataExchange",
    "Win32_System_Threading", "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi",
    "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Devices_Display",
    "Win32_Security", "Win32_Globalization", "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"
] }

[lints]
workspace = true
