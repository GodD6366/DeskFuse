[package]
name = "deskfuse-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
serde_json = "1"

[dependencies]
async-trait = "=0.1.92"
semver = "1"
axum = { version = "0.8", features = ["multipart"] }
bytes.workspace = true
tokio-util.workspace = true
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled", "functions", "hooks", "blob"] }
uuid.workspace = true
deskfuse-update = { path = "../deskfuse-update" }
deskfuse-update-platform = { path = "../deskfuse-update-platform" }
hex = "0.4"
deskfuse-platform = { path = "../deskfuse-platform" }
deskfuse-collaboration = { path = "../deskfuse-collaboration" }
bincode = "1.3.3"
flate2 = "1"
anyhow = "1"
futures = "0.3"
image = { version = "0.25.9", default-features = false, features = ["tiff", "png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
unicode-normalization = "0.1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "sync", "time"] }
deskfuse-input = { path = "../deskfuse-input" }
deskfuse-core = { path = "../deskfuse-core" }
deskfuse-protocol = { path = "../deskfuse-protocol" }
deskfuse-runtime = { path = "../deskfuse-runtime" }
deskfuse-transport = { path = "../deskfuse-transport" }
deskfuse-discovery = { path = "../deskfuse-discovery" }
deskfuse-store = { path = "../deskfuse-store" }
deskfuse-identity = { path = "../deskfuse-identity" }
deskfuse-platform-macos = { path = "../deskfuse-platform-macos" }
deskfuse-transfer = { path = "../deskfuse-transfer" }
dirs.workspace = true


[lints.rust]
unsafe_code = "warn"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "warn"

[target.'cfg(target_os = "windows")'.dependencies]
deskfuse-platform-windows = { path = "../deskfuse-platform-windows" }
