[package]
name = "unidesk-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
async-trait = "=0.1.92"
semver = "1"
axum = { version = "0.8", features = ["multipart"] }
bytes.workspace = true
tokio-util.workspace = true
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid.workspace = true
unidesk-update = { path = "../unidesk-update" }
unidesk-update-platform = { path = "../unidesk-update-platform" }
hex = "0.4"
unidesk-platform = { path = "../unidesk-platform" }
unidesk-collaboration = { path = "../unidesk-collaboration" }
bincode = "1.3.3"
flate2 = "1"
anyhow = "1"
futures = "0.3"
image = { version = "0.25.9", default-features = false, features = ["tiff", "png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
unicode-normalization = "0.1"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
unidesk-input = { path = "../unidesk-input" }
unidesk-core = { path = "../unidesk-core" }
unidesk-protocol = { path = "../unidesk-protocol" }
unidesk-runtime = { path = "../unidesk-runtime" }
unidesk-transport = { path = "../unidesk-transport" }
unidesk-discovery = { path = "../unidesk-discovery" }
unidesk-store = { path = "../unidesk-store" }
unidesk-identity = { path = "../unidesk-identity" }
unidesk-platform-macos = { path = "../unidesk-platform-macos" }
unidesk-transfer = { path = "../unidesk-transfer" }
dirs.workspace = true


[lints.rust]
unsafe_code = "warn"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "warn"

[target.'cfg(target_os = "windows")'.dependencies]
unidesk-platform-windows = { path = "../unidesk-platform-windows" }
