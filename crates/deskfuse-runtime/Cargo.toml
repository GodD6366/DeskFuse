[package]
name = "deskfuse-runtime"

description = "Single-actor Tokio runtime for DeskFuse networking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[features]
default = ["updates"]
updates = ["dep:deskfuse-update"]

[dependencies]
base64 = "0.22"
serde.workspace = true
deskfuse-update = { path = "../deskfuse-update", optional = true }
serde_json = "1"
semver = "1"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
ed25519-dalek = "2.1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
deskfuse-core = { path = "../deskfuse-core" }
deskfuse-input = { path = "../deskfuse-input" }
deskfuse-discovery = { path = "../deskfuse-discovery" }
deskfuse-identity = { path = "../deskfuse-identity" }
deskfuse-protocol = { path = "../deskfuse-protocol" }
deskfuse-store = { path = "../deskfuse-store" }
deskfuse-transport = { path = "../deskfuse-transport" }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
rcgen = "=0.13.2"
async-trait = "=0.1.92"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["time"] }
