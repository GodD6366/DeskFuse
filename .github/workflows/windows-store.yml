name: Windows Store package

# Builds the Microsoft Store (MSIX) package for the Windows desktop client.
# Packaging and verification only: never submits to Partner Center, never
# installs anything and never publishes a release asset.
#
# The machine service and the uiAccess input helper cannot be delivered by an
# MSIX package; see docs/WINDOWS_STORE.md. Identity values from Partner Center
# are supplied as inputs so the manifest matches the reserved product.

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Partner Center Package/Identity/Name (blank keeps the placeholder)'
        required: false
        default: ''
      publisher:
        description: 'Partner Center Package/Identity/Publisher, e.g. CN=XXXXXXXX-...'
        required: false
        default: ''
      publisher_display_name:
        description: 'Partner Center Publisher display name'
        required: false
        default: ''
      version:
        description: 'Override MSIX version (Major.Minor.Build.0); blank maps release.json'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  msix:
    name: Build MSIX package
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust unavailable' }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Target installation failed' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deskfuse-windows
          key: store
      - name: Validate shared release metadata
        run: python scripts/release.py validate
      - name: Generate Store image assets
        shell: pwsh
        run: ./scripts/generate-store-assets.ps1
      - name: Create a test signing certificate for the package publisher
        id: cert
        shell: pwsh
        run: |
          $publisher = '${{ inputs.publisher }}'
          if ([string]::IsNullOrWhiteSpace($publisher)) {
            $manifest = [xml](Get-Content -Raw -LiteralPath 'apps\deskfuse-windows\Package.appxmanifest')
            $publisher = $manifest.Package.Identity.Publisher
          }
          $certificate = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName 'DeskFuse Store test signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfxPath = Join-Path $env:RUNNER_TEMP 'store-test.pfx'
          $password = ConvertTo-SecureString -String ([guid]::NewGuid().ToString('N')) -AsPlainText -Force
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $password | Out-Null
          "pfx=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "password=$($password | ConvertFrom-SecureString -AsPlainText)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Pack MSIX
        shell: pwsh
        run: |
          $arguments = @{
            SigningPfx = '${{ steps.cert.outputs.pfx }}'
            SigningPassword = '${{ steps.cert.outputs.password }}'
            OutputDirectory = 'dist\windows-store'
          }
          if ('${{ inputs.identity_name }}' -ne '') { $arguments.IdentityName = '${{ inputs.identity_name }}' }
          if ('${{ inputs.publisher }}' -ne '') { $arguments.Publisher = '${{ inputs.publisher }}' }
          if ('${{ inputs.publisher_display_name }}' -ne '') { $arguments.PublisherDisplayName = '${{ inputs.publisher_display_name }}' }
          if ('${{ inputs.version }}' -ne '') { $arguments.Version = '${{ inputs.version }}' }
          & ./scripts/package-windows-store.ps1 @arguments
          $packages = @(Get-ChildItem dist\windows-store -Filter '*.msix' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one MSIX package, found $($packages.Count)" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $packages[0].FullName
      - name: Upload MSIX package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deskfuse-msix
          path: |
            dist/windows-store/*.msix
            dist/windows-store/*.sha256
            dist/windows-store/*.store.json
          if-no-files-found: error
          retention-days: 14
