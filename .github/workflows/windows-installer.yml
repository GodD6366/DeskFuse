name: Windows installer

# Builds the offline Windows installer (NSIS) without Authenticode signing.
# Packaging only: the workflow never publishes a release asset itself; the
# artifact is attached to a release only after a human decision.
#
# SmartScreen will show "unknown publisher" for an unsigned installer. The
# signed path remains release.yml, which refuses to publish unsigned builds.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Build unsigned installer
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deskfuse-windows
          key: installer
      - name: Validate shared release metadata
        run: python scripts/release.py validate
      - name: Build installer
        shell: pwsh
        run: |
          $asset = 'DeskFuse-windows-x64-setup.exe'
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          & .\scripts\snapshot-windows-source.ps1 -ProjectRoot $env:GITHUB_WORKSPACE -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'dist\source-snapshot.json')
          & .\scripts\package-windows.ps1 -ProjectRoot $env:GITHUB_WORKSPACE -ReleaseMetadata (Join-Path $env:GITHUB_WORKSPACE 'release.json') -SourceSnapshot (Join-Path $env:GITHUB_WORKSPACE 'dist\source-snapshot.json') -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist\windows')
          $built = @(Get-ChildItem dist\windows -Filter '*-windows-x64-setup.exe' -File)
          if ($built.Count -ne 1) { throw "Expected exactly one Windows installer, found $($built.Count)" }
          $target = Join-Path $built[0].DirectoryName $asset
          $sourceBase = $built[0].FullName
          Move-Item -LiteralPath $built[0].FullName -Destination $target -Force
          Move-Item -LiteralPath ($sourceBase + '.manifest.json') -Destination ($target + '.manifest.json') -Force
          Remove-Item -LiteralPath ($sourceBase + '.sha256') -Force
          $targetHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          "$targetHash  $asset" | Set-Content -LiteralPath ($target + '.sha256') -Encoding ASCII
          $manifest = Get-Content -Raw -LiteralPath ($target + '.manifest.json') | ConvertFrom-Json
          if ($manifest.installer_sha256 -ne $targetHash) { throw 'Windows installer manifest hash does not match the built installer.' }
          "authenticode=$($manifest.authenticode)" | Write-Output
          Get-FileHash -Algorithm SHA256 -LiteralPath $target
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deskfuse-windows-installer
          path: |
            dist/windows/DeskFuse-windows-x64-setup.exe
            dist/windows/DeskFuse-windows-x64-setup.exe.manifest.json
            dist/windows/DeskFuse-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
