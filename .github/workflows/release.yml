name: Prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: probe
        name: Validate tag and immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py probe --tag "$RELEASE_TAG"

  checks:
    needs: preflight
    if: needs.preflight.outputs.exists != 'true'
    uses: ./.github/workflows/ci.yml

  package:
    needs: [preflight, checks]
    runs-on: xcode-27 # Apple Silicon + Xcode 27 SDK; runtime minimum is still macOS 14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
          rustup component add rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-release
          save-if: false
      - name: Build ad-hoc DMG without Finder automation
        env:
          CODESIGN_IDENTITY: '-'
          RELEASE_METADATA: ${{ github.workspace }}/release.json
          UNIDESK_DMG_FINDER_LAYOUT: '0'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          ./scripts/package-macos.sh --bootstrap
          ./scripts/verify-dmg.sh dist/uniDesk-arm64.dmg
          python3 scripts/release.py inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/uniDesk-arm64.dmg
            dist/release.json
            dist/build-info.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify, upload draft, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG"

  # Brew cannot install an unpublished prerelease, so the cask checksum is
  # refreshed only after @publish confirms the GitHub assets are public. The
  # cask lives in this repository, which is also the tap URL documented in README.
  cask:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refresh cask from the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: unexpected release tag: $RELEASE_TAG" >&2; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern uniDesk-arm64.dmg --dir dist
          python3 scripts/update-cask.py --dmg dist/uniDesk-arm64.dmg --version "$version"
      - name: Commit refreshed cask
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/unidesk.rb; then
            echo "Homebrew cask already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/unidesk.rb
          git commit -m "chore(cask): pin $RELEASE_TAG DMG checksum"
          git push origin "HEAD:$DEFAULT_BRANCH"
