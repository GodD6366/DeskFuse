name: Prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  UNIDESK_RELEASE_REPOSITORY: GodD6366/unidesk-release

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: probe
        name: Validate tag and immutable release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing RELEASE_REPOSITORY_TOKEN (Contents write on public release repository)" >&2; exit 1; }
          python3 scripts/release.py probe --repo "$UNIDESK_RELEASE_REPOSITORY" --tag "$RELEASE_TAG"

  checks:
    needs: preflight
    if: needs.preflight.outputs.exists != 'true'
    uses: ./.github/workflows/ci.yml

  macos-arm64:
    needs: [preflight, checks]
    if: needs.preflight.outputs.exists != 'true'
    name: macOS arm64 DMG
    runs-on: xcode-27 # Apple Silicon + Xcode 27 SDK; runtime minimum is still macOS 14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
          rustup component add rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-release-arm64
          save-if: false
      - name: Import Developer ID
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: ./scripts/import-developer-id.sh
      - name: Build Developer ID arm64 DMG and notarize
        env:
          RELEASE_METADATA: ${{ github.workspace }}/release.json
          UNIDESK_MACOS_ARCH: arm64
          UNIDESK_DMG_FINDER_LAYOUT: '0'
          UNIDESK_REQUIRE_NOTARIZE: '1'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/package-macos.sh --homebrew
          ./scripts/verify-dmg.sh dist/uniDesk-arm64.dmg
          cp dist/.signing dist/signing-arm64.txt
      - name: Remove signing material
        if: always()
        run: ./scripts/cleanup-developer-id.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-arm64
          path: |
            dist/uniDesk-arm64.dmg
            dist/release.json
            dist/signing-arm64.txt
          if-no-files-found: error
          retention-days: 14

  macos-x86_64:
    needs: [preflight, checks]
    if: needs.preflight.outputs.exists != 'true'
    name: macOS Intel x86_64 DMG
    runs-on: xcode-27 # Cross-compiles the Intel target with the same macOS 27 SDK
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Intel toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add x86_64-apple-darwin
          rustup component add rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-release-x86_64
          save-if: false
      - name: Import Developer ID
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: ./scripts/import-developer-id.sh
      - name: Build Developer ID Intel DMG and notarize
        env:
          RELEASE_METADATA: ${{ github.workspace }}/release.json
          UNIDESK_MACOS_ARCH: x86_64
          UNIDESK_DMG_FINDER_LAYOUT: '0'
          UNIDESK_REQUIRE_NOTARIZE: '1'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/package-macos.sh --homebrew
          ./scripts/verify-dmg.sh dist/uniDesk-x86_64.dmg
          cp dist/.signing dist/signing-x86_64.txt
      - name: Remove signing material
        if: always()
        run: ./scripts/cleanup-developer-id.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-x86_64
          path: |
            dist/uniDesk-x86_64.dmg
            dist/release.json
            dist/signing-x86_64.txt
          if-no-files-found: error
          retention-days: 14

  windows-x86_64:
    needs: [preflight, checks]
    if: needs.preflight.outputs.exists != 'true'
    name: Windows x86_64 installer
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned x86_64 Rust target
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build unsigned x86_64 offline installer
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP 'unidesk-source.json'
          .\scripts\snapshot-windows-source.ps1 -OutputPath $snapshot
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist-windows'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          .\scripts\package-windows.ps1 -SourceSnapshot $snapshot -ReleaseMetadata .\release.json -OutputDirectory $output
          $installer = Get-ChildItem -LiteralPath $output -Filter '*-windows-x64-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Windows x64 installer was not produced' }
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $output 'uniDesk-windows-x64-setup.exe') -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x86_64
          path: dist-windows/uniDesk-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [macos-arm64, macos-x86_64, windows-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-arm64
          path: dist/arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-x86_64
          path: dist/x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-x86_64
          path: dist/windows
      - name: Assemble and verify the complete release inventory
        run: |
          set -euo pipefail
          cp dist/arm64/uniDesk-arm64.dmg dist/
          cp dist/x86_64/uniDesk-x86_64.dmg dist/
          cp dist/windows/uniDesk-windows-x64-setup.exe dist/
          cmp dist/arm64/release.json dist/x86_64/release.json
          cp dist/arm64/release.json dist/release.json
          cp dist/arm64/signing-arm64.txt dist/.signing-arm64
          cp dist/x86_64/signing-x86_64.txt dist/.signing-x86_64
          python3 scripts/release.py inventory --directory dist --commit "$GITHUB_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Verify, upload draft, then publish prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A public tag points only at the distribution tree. Never push source
          # tags/commits from this private repository into the public repository.
          if ! gh api "repos/$UNIDESK_RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            public_sha="$(gh api "repos/$UNIDESK_RELEASE_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            gh api --method POST "repos/$UNIDESK_RELEASE_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$public_sha" > /dev/null
          fi
          python3 scripts/release.py publish --repo "$UNIDESK_RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"

  # Brew cannot install an unpublished prerelease, so the cask checksum is
  # refreshed only after @publish confirms the GitHub assets are public. The
  # cask is written only to the public distribution repository.
  cask:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.UNIDESK_RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          ref: main
          path: distribution
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Refresh cask from the published arm64 DMG
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: unexpected release tag: $RELEASE_TAG" >&2; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$UNIDESK_RELEASE_REPOSITORY" --pattern uniDesk-arm64.dmg --dir dist
          python3 source/scripts/update-cask.py --dmg dist/uniDesk-arm64.dmg --version "$version" --cask distribution/Casks/unidesk.rb
      - name: Commit refreshed cask
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          cd distribution
          if git diff --quiet -- Casks/unidesk.rb; then
            echo "Homebrew cask already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/unidesk.rb
          git commit -m "chore(cask): pin $RELEASE_TAG DMG checksum"
          git push origin "HEAD:$DEFAULT_BRANCH"
