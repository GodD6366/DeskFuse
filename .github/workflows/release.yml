name: Prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: probe
        name: Validate tag and immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py probe --tag "$RELEASE_TAG"

  checks:
    needs: preflight
    if: needs.preflight.outputs.exists != 'true'
    uses: ./.github/workflows/ci.yml

  package:
    needs: [preflight, checks]
    runs-on: xcode-27 # Apple Silicon + Xcode 27 SDK; runtime minimum is still macOS 14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
          rustup component add rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-release
          save-if: false
      - name: Build ad-hoc DMG without Finder automation
        env:
          CODESIGN_IDENTITY: '-'
          RELEASE_METADATA: ${{ github.workspace }}/release.json
          UNIDESK_DMG_FINDER_LAYOUT: '0'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          ./scripts/package-macos.sh --bootstrap
          ./scripts/verify-dmg.sh dist/uniDesk-arm64.dmg
          python3 scripts/release.py inventory
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/uniDesk-arm64.dmg
            dist/release.json
            dist/build-info.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify, upload draft, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG"
