name: Prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27]
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
      release_repository: ${{ steps.distribution.outputs.release_repository }}
      arm64_asset: ${{ steps.distribution.outputs.arm64_asset }}
      x86_64_asset: ${{ steps.distribution.outputs.x86_64_asset }}
      cask_path: ${{ steps.distribution.outputs.cask_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: distribution
        run: python3 scripts/distribution-config.py --github-output "$GITHUB_OUTPUT"
      - id: probe
        name: Validate tag and immutable release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          DESKFUSE_RELEASE_REPOSITORY: ${{ steps.distribution.outputs.release_repository }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing RELEASE_REPOSITORY_TOKEN (Contents write on public release repository)" >&2; exit 1; }
          python3 scripts/release.py probe --tag "$RELEASE_TAG"

  checks:
    needs: preflight
    if: needs.preflight.outputs.exists != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      skip_windows: true

  macos-arm64:
    needs: [preflight, checks]
    env:
      ARM64_ASSET: ${{ needs.preflight.outputs.arm64_asset }}
    if: needs.preflight.outputs.exists != 'true'
    name: macOS arm64 DMG
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27] # Apple Silicon + Xcode 27 SDK; runtime minimum is still macOS 14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
          rustup component add rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-release-arm64
          save-if: false
      - name: Import Developer ID
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: ./scripts/import-developer-id.sh
      - name: Build Developer ID arm64 DMG and notarize
        env:
          RELEASE_METADATA: ${{ github.workspace }}/release.json
          DESKFUSE_MACOS_ARCH: arm64
          DESKFUSE_DMG_FINDER_LAYOUT: '0'
          DESKFUSE_REQUIRE_NOTARIZE: '1'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/package-macos.sh --homebrew
          ./scripts/verify-dmg.sh "dist/$ARM64_ASSET"
          cp dist/.signing dist/signing-arm64.txt
      - name: Remove signing material
        if: always()
        run: ./scripts/cleanup-developer-id.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-arm64
          path: |
            dist/${{ env.ARM64_ASSET }}
            dist/release.json
            dist/signing-arm64.txt
          if-no-files-found: error
          retention-days: 14

  macos-x86_64:
    needs: [preflight, checks]
    env:
      X86_64_ASSET: ${{ needs.preflight.outputs.x86_64_asset }}
    if: needs.preflight.outputs.exists != 'true'
    name: macOS Intel x86_64 DMG
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27] # Cross-compiles the Intel target with the same macOS 27 SDK
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Intel toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add x86_64-apple-darwin
          rustup component add rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-release-x86_64
          save-if: false
      - name: Import Developer ID
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: ./scripts/import-developer-id.sh
      - name: Build Developer ID Intel DMG and notarize
        env:
          RELEASE_METADATA: ${{ github.workspace }}/release.json
          DESKFUSE_MACOS_ARCH: x86_64
          DESKFUSE_DMG_FINDER_LAYOUT: '0'
          DESKFUSE_REQUIRE_NOTARIZE: '1'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/package-macos.sh --homebrew
          ./scripts/verify-dmg.sh "dist/$X86_64_ASSET"
          cp dist/.signing dist/signing-x86_64.txt
      - name: Remove signing material
        if: always()
        run: ./scripts/cleanup-developer-id.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-x86_64
          path: |
            dist/${{ env.X86_64_ASSET }}
            dist/release.json
            dist/signing-x86_64.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [preflight, macos-arm64, macos-x86_64]
    env:
      DESKFUSE_RELEASE_REPOSITORY: ${{ needs.preflight.outputs.release_repository }}
      ARM64_ASSET: ${{ needs.preflight.outputs.arm64_asset }}
      X86_64_ASSET: ${{ needs.preflight.outputs.x86_64_asset }}
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-arm64
          path: dist/arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos-x86_64
          path: dist/x86_64
      - name: Assemble and verify the complete release inventory
        run: |
          set -euo pipefail
          cp "dist/arm64/$ARM64_ASSET" dist/
          cp "dist/x86_64/$X86_64_ASSET" dist/
          cmp dist/arm64/release.json dist/x86_64/release.json
          cp dist/arm64/release.json dist/release.json
          cp dist/arm64/signing-arm64.txt dist/.signing-arm64
          cp dist/x86_64/signing-x86_64.txt dist/.signing-x86_64
          python3 scripts/release.py inventory --directory dist --commit "$GITHUB_SHA"
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Verify, upload draft, then publish prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A public tag points only at the distribution tree. Never push source
          # tags/commits from this private repository into the public repository.
          if ! gh api "repos/$DESKFUSE_RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            public_sha="$(gh api "repos/$DESKFUSE_RELEASE_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            gh api --method POST "repos/$DESKFUSE_RELEASE_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$public_sha" > /dev/null
          fi
          python3 scripts/release.py publish --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"

  # Brew cannot install an unpublished prerelease, so the cask checksum is
  # refreshed only after @publish confirms the GitHub assets are public. The
  # cask is written only to the public distribution repository.
  cask:
    needs: [preflight, publish]
    env:
      DESKFUSE_RELEASE_REPOSITORY: ${{ needs.preflight.outputs.release_repository }}
      ARM64_ASSET: ${{ needs.preflight.outputs.arm64_asset }}
      CASK_PATH: ${{ needs.preflight.outputs.cask_path }}
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.DESKFUSE_RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          ref: main
          path: distribution
      - name: Refresh cask from the published arm64 DMG
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: unexpected release tag: $RELEASE_TAG" >&2; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$DESKFUSE_RELEASE_REPOSITORY" --pattern "$ARM64_ASSET" --dir dist --clobber
          python3 source/scripts/update-cask.py --dmg "dist/$ARM64_ASSET" --version "$version" --cask "distribution/$CASK_PATH"
          python3 source/scripts/distribution-config.py --website-output distribution/web/src/config/distribution.json
      - name: Commit refreshed cask
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          cd distribution
          if git diff --quiet -- "$CASK_PATH" web/src/config/distribution.json && test -z "$(git ls-files --others --exclude-standard -- "$CASK_PATH" web/src/config/distribution.json)"; then
            echo "Homebrew cask already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_PATH" web/src/config/distribution.json
          git commit -m "chore(cask): pin $RELEASE_TAG DMG checksum"
          git push origin "HEAD:$DEFAULT_BRANCH"
