name: Prerelease

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# 发行版与源码在同一个公开仓库。顶层 GITHUB_TOKEN 只读；只有 publish（创建 Release）、
# cask（提交 Casks/ 与站点配置）和 pages（触发站点部署）三个 job 单独声明写权限。
# 过渡期内，旧发行仓库通过只授权该仓库的 RELEASE_REPOSITORY_TOKEN 镜像同一版本，
# 让编译时写死旧仓库地址的已安装客户端也能升级到过渡版本。
# 签名与发行凭据存放在 `release` environment，只对 `v*` tag 开放（tag 由 ruleset
# 限定管理员创建）；读取 secrets 的 job 必须声明 environment: release。
# 自托管 runner 不执行未审阅代码（见 ci.yml）。
#
# Keep Windows out of the prerelease until Authenticode signing is available.
# Set the DESKFUSE_INCLUDE_WINDOWS_RELEASE repository variable to `true` to
# re-enable the Windows job and asset in a future release.
env:
  DESKFUSE_INCLUDE_WINDOWS_RELEASE: ${{ vars.DESKFUSE_INCLUDE_WINDOWS_RELEASE || 'false' }}

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    environment: release
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27]
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.probe.outputs.exists }}
      release_repository: ${{ steps.distribution.outputs.release_repository }}
      legacy_release_repository: ${{ steps.distribution.outputs.legacy_release_repository }}
      arm64_asset: ${{ steps.distribution.outputs.arm64_asset }}
      x86_64_asset: ${{ steps.distribution.outputs.x86_64_asset }}
      windows_x64_asset: ${{ steps.distribution.outputs.windows_x64_asset }}
      cask_path: ${{ steps.distribution.outputs.cask_path }}
      include_windows: ${{ steps.release_mode.outputs.include_windows }}
    steps:
      - name: Require an existing version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Select an existing vX.Y.Z tag when running this workflow manually; branches cannot be released. Use gh workflow run release.yml --ref vX.Y.Z."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: distribution
        run: python3 scripts/distribution-config.py --github-output "$GITHUB_OUTPUT"
      - id: release_mode
        name: Select release targets
        run: |
          case "$DESKFUSE_INCLUDE_WINDOWS_RELEASE" in
            true|false) ;;
            *) echo "::error::DESKFUSE_INCLUDE_WINDOWS_RELEASE must be true or false"; exit 1 ;;
          esac
          echo "include_windows=$DESKFUSE_INCLUDE_WINDOWS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Windows release assets enabled: $DESKFUSE_INCLUDE_WINDOWS_RELEASE"
      - id: probe
        name: Validate tag and immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DESKFUSE_RELEASE_REPOSITORY: ${{ steps.distribution.outputs.release_repository }}
          LEGACY_RELEASE_REPOSITORY: ${{ steps.distribution.outputs.legacy_release_repository }}
          LEGACY_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: |
          if [[ -n "$LEGACY_RELEASE_REPOSITORY" ]]; then
            test -n "$LEGACY_TOKEN" || { echo "Missing RELEASE_REPOSITORY_TOKEN (Contents write on $LEGACY_RELEASE_REPOSITORY) for the transition mirror" >&2; exit 1; }
          fi
          probe_args=()
          if [[ "$DESKFUSE_INCLUDE_WINDOWS_RELEASE" != "true" ]]; then probe_args+=(--macos-only); fi
          python3 scripts/release.py probe --tag "$RELEASE_TAG" "${probe_args[@]}"

  checks:
    needs: preflight
    if: needs.preflight.outputs.exists != 'true'
    uses: ./.github/workflows/ci.yml

  macos-arm64:
    environment: release
    needs: [preflight, checks]
    env:
      ARM64_ASSET: ${{ needs.preflight.outputs.arm64_asset }}
    if: needs.preflight.outputs.exists != 'true'
    name: macOS arm64 DMG
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27] # Apple Silicon + Xcode 27 SDK; runtime minimum is still macOS 14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
          rustup component add rust-src
          source scripts/rust-toolchain-env.sh
          dirname "$(command -v cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deskfuse-macos
          key: release-arm64
          save-if: false
      - name: Import Developer ID
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: ./scripts/import-developer-id.sh
      - name: Build Developer ID arm64 DMG and notarize
        env:
          RELEASE_METADATA: ${{ github.workspace }}/release.json
          DESKFUSE_MACOS_ARCH: arm64
          DESKFUSE_DMG_FINDER_LAYOUT: '0'
          DESKFUSE_REQUIRE_NOTARIZE: '1'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/package-macos.sh --homebrew
          ./scripts/verify-dmg.sh "dist/$ARM64_ASSET"
          cp dist/.signing dist/signing-arm64.txt
      - name: Remove signing material
        if: always()
        run: ./scripts/cleanup-developer-id.sh
      - name: Store release-macos-arm64 for publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-arm64
          path: |
            dist/${{ env.ARM64_ASSET }}
            dist/release.json
            dist/signing-arm64.txt
          if-no-files-found: error
          retention-days: 1

  macos-x86_64:
    environment: release
    needs: [preflight, checks]
    env:
      X86_64_ASSET: ${{ needs.preflight.outputs.x86_64_asset }}
    if: needs.preflight.outputs.exists != 'true'
    name: macOS Intel x86_64 DMG
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27] # Cross-compiles the Intel target with the same macOS 27 SDK
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Intel toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add x86_64-apple-darwin
          rustup component add rust-src
          source scripts/rust-toolchain-env.sh
          dirname "$(command -v cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deskfuse-macos
          key: release-x86_64
          save-if: false
      - name: Import Developer ID
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: ./scripts/import-developer-id.sh
      - name: Build Developer ID Intel DMG and notarize
        env:
          RELEASE_METADATA: ${{ github.workspace }}/release.json
          DESKFUSE_MACOS_ARCH: x86_64
          DESKFUSE_DMG_FINDER_LAYOUT: '0'
          DESKFUSE_REQUIRE_NOTARIZE: '1'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/package-macos.sh --homebrew
          ./scripts/verify-dmg.sh "dist/$X86_64_ASSET"
          cp dist/.signing dist/signing-x86_64.txt
      - name: Remove signing material
        if: always()
        run: ./scripts/cleanup-developer-id.sh
      - name: Store release-macos-x86_64 for publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-x86_64
          path: |
            dist/${{ env.X86_64_ASSET }}
            dist/release.json
            dist/signing-x86_64.txt
          if-no-files-found: error
          retention-days: 1

  windows-x64:
    environment: release
    needs: [preflight, checks]
    if: needs.preflight.outputs.exists != 'true' && needs.preflight.outputs.include_windows == 'true'
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      WINDOWS_ASSET: ${{ needs.preflight.outputs.windows_x64_asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require NSIS and Authenticode signing tools
        shell: pwsh
        run: |
          $makeNsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (!$makeNsis) {
            $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
            if (Test-Path -LiteralPath $nsisPath -PathType Leaf) { $makeNsis = Get-Item -LiteralPath $nsisPath }
          }
          if (!$makeNsis) { throw 'NSIS 3 (makensis.exe) is required; no installed copy was found and the release job will not download tools implicitly.' }

          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (!$signTool) {
            $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            if (Test-Path -LiteralPath $kitsRoot -PathType Container) {
              $signToolPath = Get-ChildItem -LiteralPath $kitsRoot -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq 'x64' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
              if ($signToolPath) { $signTool = Get-Item -LiteralPath $signToolPath }
            }
          }
          if (!$signTool) { throw 'Windows SDK x64 signtool.exe is required; no installed copy was found and the release job will not download tools implicitly.' }
          $makeNsisPath = if ($makeNsis.Source) { $makeNsis.Source } else { $makeNsis.FullName }
          $signToolPath = if ($signTool.Source) { $signTool.Source } else { $signTool.FullName }
          (Split-Path -Parent $makeNsisPath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Split-Path -Parent $signToolPath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Import Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_AUTHENTICODE_PFX_B64: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_B64 }}
          WINDOWS_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_AUTHENTICODE_PFX_B64)) { throw 'Missing WINDOWS_AUTHENTICODE_PFX_B64; refusing to publish an unsigned installer.' }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'deskfuse-authenticode.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_AUTHENTICODE_PFX_B64))
          $password = ConvertTo-SecureString $env:WINDOWS_AUTHENTICODE_PFX_PASSWORD -AsPlainText -Force
          $existingThumbprints = @(Get-ChildItem Cert:\CurrentUser\My | ForEach-Object { $_.Thumbprint })
          try {
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $newThumbprints = @($imported | Where-Object { $_.Thumbprint -notin $existingThumbprints } | ForEach-Object { $_.Thumbprint } | Sort-Object -Unique)
            $now = [DateTime]::UtcNow
            $candidates = @($imported | Where-Object {
              $certificate = $_
              $codeSigningEku = @($certificate.Extensions | Where-Object {
                $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]
              } | ForEach-Object { $_.EnhancedKeyUsages } | ForEach-Object { $_ } | Where-Object {
                $_.Value -eq '1.3.6.1.5.5.7.3.3'
              }).Count -gt 0
              $certificate.HasPrivateKey -and $certificate.NotBefore.ToUniversalTime() -le $now -and $certificate.NotAfter.ToUniversalTime() -gt $now -and $codeSigningEku
            })
            if ($candidates.Count -ne 1) { throw "Expected exactly one current code-signing certificate with a private key in the PFX, found $($candidates.Count)." }
            "WINDOWS_AUTHENTICODE_THUMBPRINT=$($candidates[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WINDOWS_IMPORTED_CERT_THUMBPRINTS=$($newThumbprints -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            $currentThumbprints = @(Get-ChildItem Cert:\CurrentUser\My | ForEach-Object { $_.Thumbprint })
            foreach ($thumbprint in @($currentThumbprints | Where-Object { $_ -notin $existingThumbprints })) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
            throw
          }
      - name: Build shared-metadata Windows installer
        shell: pwsh
        env:
          WINDOWS_AUTHENTICODE_TIMESTAMP_URL: ${{ vars.WINDOWS_AUTHENTICODE_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          & .\scripts\snapshot-windows-source.ps1 -ProjectRoot $env:GITHUB_WORKSPACE -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'dist\source-snapshot.json')
          & .\scripts\package-windows.ps1 -ProjectRoot $env:GITHUB_WORKSPACE -ReleaseMetadata (Join-Path $env:GITHUB_WORKSPACE 'release.json') -SourceSnapshot (Join-Path $env:GITHUB_WORKSPACE 'dist\source-snapshot.json') -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'dist\windows') -AuthenticodeCertificateThumbprint $env:WINDOWS_AUTHENTICODE_THUMBPRINT -AuthenticodeTimestampUrl $env:WINDOWS_AUTHENTICODE_TIMESTAMP_URL
          $built = @(Get-ChildItem dist\windows -Filter '*-windows-x64-setup.exe' -File)
          if ($built.Count -ne 1) { throw "Expected exactly one Windows installer, found $($built.Count)" }
          $target = Join-Path $built[0].DirectoryName $env:WINDOWS_ASSET
          $sourceBase = $built[0].FullName
          Move-Item -LiteralPath $built[0].FullName -Destination $target -Force
          Move-Item -LiteralPath ($sourceBase + '.manifest.json') -Destination ($target + '.manifest.json') -Force
          Remove-Item -LiteralPath ($sourceBase + '.sha256') -Force
          $targetHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          "$targetHash  $env:WINDOWS_ASSET" | Set-Content -LiteralPath ($target + '.sha256') -Encoding ASCII
          $manifest = Get-Content -Raw -LiteralPath ($target + '.manifest.json') | ConvertFrom-Json
          if ($manifest.authenticode -ne 'Valid') { throw "Windows installer is not Authenticode-signed (status: $($manifest.authenticode)); refusing to publish." }
          if ($manifest.release_signed -ne $true) { throw 'Windows installer payload is not fully Authenticode-signed; refusing to publish.' }
          if ($manifest.installer_sha256 -ne $targetHash) { throw 'Windows installer manifest hash does not match the renamed release asset.' }
      - name: Store release-windows-x64 for publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: |
            dist/windows/${{ env.WINDOWS_ASSET }}
            dist/windows/${{ env.WINDOWS_ASSET }}.manifest.json
            dist/windows/${{ env.WINDOWS_ASSET }}.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Remove Authenticode certificate
        if: always()
        shell: pwsh
        run: |
          foreach ($thumbprint in @($env:WINDOWS_IMPORTED_CERT_THUMBPRINTS -split ',' | Where-Object { $_ })) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'deskfuse-authenticode.pfx') -Force -ErrorAction SilentlyContinue

  publish:
    environment: release
    needs: [preflight, macos-arm64, macos-x86_64, windows-x64]
    if: >-
      always() &&
      needs.preflight.outputs.exists != 'true' &&
      needs.macos-arm64.result == 'success' &&
      needs.macos-x86_64.result == 'success' &&
      (needs.windows-x64.result == 'success' || needs.windows-x64.result == 'skipped')
    env:
      DESKFUSE_RELEASE_REPOSITORY: ${{ needs.preflight.outputs.release_repository }}
      ARM64_ASSET: ${{ needs.preflight.outputs.arm64_asset }}
      X86_64_ASSET: ${{ needs.preflight.outputs.x86_64_asset }}
      WINDOWS_ASSET: ${{ needs.preflight.outputs.windows_x64_asset }}
      INCLUDE_WINDOWS: ${{ needs.preflight.outputs.include_windows }}
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27]
    # Artifact downloads on the self-hosted runner can be slow; keep enough
    # time for both DMGs before the public inventory is assembled.
    timeout-minutes: 90
    # 创建并发布本仓库的 Release 需要 contents: write；tag 由 ruleset 限定管理员创建。
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download complete release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-arm64
          path: dist/arm64
      - name: Download Intel release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-x86_64
          path: dist/x86_64
      - name: Download Windows release archive
        if: env.INCLUDE_WINDOWS == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-x64
          path: dist/windows
      - name: Check downloaded archives
        run: |
          test -s "dist/arm64/$ARM64_ASSET"
          test -s dist/arm64/signing-arm64.txt
          test -s "dist/x86_64/$X86_64_ASSET"
          test -s dist/x86_64/signing-x86_64.txt
      - name: Verify downloaded macOS DMGs
        env:
          DESKFUSE_REQUIRE_NOTARIZE: '1'
          DESKFUSE_DMG_FINDER_LAYOUT: '0'
        run: |
          DESKFUSE_MACOS_ARCH=arm64 ./scripts/verify-dmg.sh "dist/arm64/$ARM64_ASSET"
          DESKFUSE_MACOS_ARCH=x86_64 ./scripts/verify-dmg.sh "dist/x86_64/$X86_64_ASSET"
      - name: Assemble and verify the complete release inventory
        run: |
          set -euo pipefail
          source scripts/rust-toolchain-env.sh
          cp "dist/arm64/$ARM64_ASSET" dist/
          cp "dist/x86_64/$X86_64_ASSET" dist/
          inventory_args=(--macos-only)
          if [[ "$INCLUDE_WINDOWS" == "true" ]]; then
            cp "dist/windows/$WINDOWS_ASSET" dist/
            cp "dist/windows/$WINDOWS_ASSET.manifest.json" "dist/$WINDOWS_ASSET.manifest.json"
            inventory_args=()
          fi
          cmp dist/arm64/release.json dist/x86_64/release.json
          cp dist/arm64/release.json dist/release.json
          cp dist/arm64/signing-arm64.txt dist/.signing-arm64
          cp dist/x86_64/signing-x86_64.txt dist/.signing-x86_64
          python3 scripts/release.py inventory --directory dist --commit "$GITHUB_SHA" "${inventory_args[@]}"
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Verify, upload draft, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          publish_args=()
          if [[ "$INCLUDE_WINDOWS" != "true" ]]; then publish_args+=(--macos-only); fi
          python3 scripts/release.py publish --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" "${publish_args[@]}"

  # 过渡期：把刚发布的同一批资产镜像到旧发行仓库。已安装的旧客户端只查询旧仓库，
  # 升级到这个版本后改从本仓库检查更新。过渡完成后删除 legacy_release_repository，
  # 这个 job 自动跳过。
  mirror-legacy:
    environment: release
    needs: [preflight, publish]
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      needs.preflight.outputs.legacy_release_repository != ''
    env:
      DESKFUSE_RELEASE_REPOSITORY: ${{ needs.preflight.outputs.release_repository }}
      LEGACY_RELEASE_REPOSITORY: ${{ needs.preflight.outputs.legacy_release_repository }}
      INCLUDE_WINDOWS: ${{ needs.preflight.outputs.include_windows }}
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          gh release download "$RELEASE_TAG" --repo "$DESKFUSE_RELEASE_REPOSITORY" --dir dist
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Mirror to the legacy release repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 旧仓库的 tag 只指向它自己的发行说明分支，不推送源码对象。
          if ! gh api "repos/$LEGACY_RELEASE_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            legacy_sha="$(gh api "repos/$LEGACY_RELEASE_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            gh api --method POST "repos/$LEGACY_RELEASE_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$legacy_sha" > /dev/null
          fi
          publish_args=()
          if [[ "$INCLUDE_WINDOWS" != "true" ]]; then publish_args+=(--macos-only); fi
          python3 scripts/release.py publish --directory dist --repo "$LEGACY_RELEASE_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" "${publish_args[@]}"

  # Brew cannot install an unpublished prerelease, so the cask checksum is
  # refreshed only after @publish confirms the GitHub assets are public.
  cask:
    environment: release
    needs: [preflight, publish, mirror-legacy]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.publish.result == 'success' &&
      (needs.mirror-legacy.result == 'success' || needs.mirror-legacy.result == 'skipped') &&
      needs.preflight.outputs.exists != 'true'
    env:
      DESKFUSE_RELEASE_REPOSITORY: ${{ needs.preflight.outputs.release_repository }}
      LEGACY_RELEASE_REPOSITORY: ${{ needs.preflight.outputs.legacy_release_repository }}
      ARM64_ASSET: ${{ needs.preflight.outputs.arm64_asset }}
      CASK_PATH: ${{ needs.preflight.outputs.cask_path }}
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27]
    timeout-minutes: 15
    # 把 Casks/ 与站点配置提交到本仓库 main；这是 tap 与站点读取的位置。
    permissions:
      contents: write
    steps:
      # 需要 git push：例外地保留本仓库 checkout 的凭据（见 CONTRIBUTING「凭据落盘」）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
      - name: Download the published arm64 DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: unexpected release tag: $RELEASE_TAG" >&2; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$DESKFUSE_RELEASE_REPOSITORY" --pattern "$ARM64_ASSET" --dir dist --clobber
      - name: Commit refreshed cask and website config
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd source
          python3 scripts/update-cask.py --dmg "../dist/$ARM64_ASSET" --version "${RELEASE_TAG#v}" --cask "$CASK_PATH"
          # 站点回退版本取自 tag 对应的 release.json，而不是 main 上可能更新的描述文件。
          git fetch --quiet --depth 1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git show "$RELEASE_TAG:release.json" > /tmp/deskfuse-release-descriptor.json
          cp /tmp/deskfuse-release-descriptor.json release.json
          python3 scripts/distribution-config.py --website-output web/src/config/distribution.json
          git checkout -- release.json
          if git diff --quiet -- "$CASK_PATH" web/src/config/distribution.json; then
            echo "Homebrew cask already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_PATH" web/src/config/distribution.json
          git commit -m "chore(cask): pin $RELEASE_TAG DMG checksum"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "error: failed to push the refreshed cask" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.LEGACY_RELEASE_REPOSITORY != ''
        with:
          repository: ${{ env.LEGACY_RELEASE_REPOSITORY }}
          token: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          ref: main
          path: legacy
      - name: Point the legacy tap at the source repository
        if: env.LEGACY_RELEASE_REPOSITORY != ''
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 source/scripts/update-cask.py --dmg "dist/$ARM64_ASSET" --version "${RELEASE_TAG#v}" \
            --cask "legacy/$CASK_PATH" --retap-notice
          cd legacy
          if git diff --quiet -- "$CASK_PATH"; then
            echo "Legacy cask already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_PATH"
          git commit -m "chore(cask): $RELEASE_TAG moves the tap to the source repository"
          git push origin HEAD:main

  # GITHUB_TOKEN 推送的提交不会触发 push 事件；显式在 main 上触发站点部署，
  # 让 api/releases.json 立即包含新版本（github-pages 环境只允许 main 部署）。
  pages:
    needs: [cask]
    if: always() && needs.cask.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the Pages deployment on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
