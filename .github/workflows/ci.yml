name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# 公开仓库的触发边界（修改前先读 CONTRIBUTING.md 的「CI 与 Actions 规则」）：
# - 自托管 runner 同时承担 Developer ID 签名与发布，只执行可信代码：
#   push main、tag 调用、维护者手动触发，以及同仓库分支（非 Dependabot）的 PR。
# - fork PR 与 Dependabot PR 只在 GitHub-hosted runner 上做静态检查；维护者审阅
#   代码后如需完整验证，把分支推到本仓库或手动 workflow_dispatch。
# - 禁止引入 pull_request_target / workflow_run 等以基础仓库权限运行 PR 代码的触发器。
#
# Windows CI is opt-in while the Windows installer remains Beta. Set the
# DESKFUSE_RUN_WINDOWS_CI repository variable to `true` to re-enable it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  untrusted-pr:
    name: Fork PR static checks (GitHub-hosted)
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow lint and credential scan
        run: ./scripts/check-ci.sh
      - name: Rust formatting
        run: cargo fmt --all -- --check

  macos:
    name: macOS arm64 checks
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27] # Apple Silicon + Xcode 27 SDK; runtime minimum is still macOS 14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
          rustup component add rust-src
          source scripts/rust-toolchain-env.sh
          dirname "$(command -v cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deskfuse-macos
          key: check
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Workflow lint and credential scan
        run: ./scripts/check-ci.sh
      - name: Repository and release tooling checks
        env:
          RETIRED_BRAND: ${{ vars.RETIRED_BRAND }}
        run: |
          python3 scripts/check-branding.py --forbidden "$RETIRED_BRAND"
          python3 scripts/check-repository.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Native RDP bridge regression
        run: ./scripts/build-freerdp-macos.sh --test
      - name: Rust checks
        # Loopback QUIC tests each own a multi-thread runtime and real deadlines;
        # do not oversubscribe the small hosted runner with multiple such tests.
        env:
          RUST_TEST_THREADS: '1'
        run: ./scripts/check.sh

  macos-build:
    name: macOS arm64 DMG
    if: github.event_name != 'workflow_call' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64, deskfuse-macos, xcode-27]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
          rustup component add rust-src
          source scripts/rust-toolchain-env.sh
          dirname "$(command -v cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deskfuse-macos
          key: build
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Validate public source boundary
        run: python3 scripts/check-repository.py
      - name: Build main-branch Homebrew DMG
        env:
          CODESIGN_IDENTITY: '-'
          RELEASE_METADATA: ${{ github.workspace }}/release.json
          DESKFUSE_DMG_FINDER_LAYOUT: '0'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          ./scripts/package-macos.sh --homebrew
          ./scripts/verify-dmg.sh dist/DeskFuse-arm64.dmg

  windows:
    name: Windows adapters, service, and catalog checks
    if: vars.DESKFUSE_RUN_WINDOWS_CI == 'true'
    runs-on: windows-2022 # GitHub-hosted；不要给自托管 runner 添加同名标签
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust unavailable' }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Target installation failed' }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: deskfuse-windows
          key: check
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Validate shared release metadata and workspace version
        shell: pwsh
        run: python scripts/release.py validate
      - name: Native adapter checks (no real input or clipboard)
        run: ./scripts/check-windows-native.ps1
      - name: Service checks (no SCM installation)
        run: ./scripts/check-windows-service.ps1
      - name: WPF desktop compile (no launch)
        run: dotnet build apps/deskfuse-windows/DeskFuse.Windows.csproj -c Release
