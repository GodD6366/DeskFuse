[package]
name = "unidesk-service"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
unidesk-core = { path = "../../crates/unidesk-core" }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
bincode = "1.3"
flate2 = "1"
image = { version = "0.25.9", default-features = false, features = ["tiff", "png"] }
sha2.workspace = true
unidesk-protocol = { path = "../../crates/unidesk-protocol" }
unidesk-identity = { path = "../../crates/unidesk-identity" }
unidesk-runtime = { path = "../../crates/unidesk-runtime" }
unidesk-store = { path = "../../crates/unidesk-store" }
unidesk-transport = { path = "../../crates/unidesk-transport" }
unidesk-discovery = { path = "../../crates/unidesk-discovery" }
unidesk-input = { path = "../../crates/unidesk-input" }
unidesk-transfer = { path = "../../crates/unidesk-transfer" }
unidesk-platform = { path = "../../crates/unidesk-platform" }
unidesk-platform-windows = { path = "../../crates/unidesk-platform-windows" }
uuid.workspace = true
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_SystemInformation", "Win32_System_Services", "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_Storage_FileSystem"
] }

[[bin]]
name = "unidesk-service"
path = "src/main.rs"

[[bin]]
name = "unidesk-service-client"
path = "src/client.rs"

[[bin]]
name = "unidesk-input-helper"
path = "src/input_helper.rs"

[lints]
workspace = true
