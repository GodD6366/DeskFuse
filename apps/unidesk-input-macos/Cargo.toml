[package]
name = "unidesk-input-macos"
description = "macOS input-only host. No content-library, workflow, lan-web, or update dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "unidesk-input-macos"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
unidesk-collaboration = { path = "../../crates/unidesk-collaboration" }
unidesk-platform = { path = "../../crates/unidesk-platform" }

[lints]
workspace = true
