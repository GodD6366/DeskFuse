[package]
name = "deskfuse-input-windows"
description = "Windows input helper host. No content-library, workflow, lan-web, or update dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "deskfuse-input-windows"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
deskfuse-collaboration = { path = "../../crates/deskfuse-collaboration" }
deskfuse-platform = { path = "../../crates/deskfuse-platform" }

[lints]
workspace = true
