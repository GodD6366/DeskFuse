[package]
name = "deskfuse-probe"

description = "Headless two-Mac verification probe for DeskFuse M1 discovery/pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
deskfuse-core = { path = "../../crates/deskfuse-core" }
deskfuse-discovery = { path = "../../crates/deskfuse-discovery" }
deskfuse-identity = { path = "../../crates/deskfuse-identity" }
prost = "0.14"
deskfuse-protocol = { path = "../../crates/deskfuse-protocol" }
deskfuse-runtime = { path = "../../crates/deskfuse-runtime" }
deskfuse-transport = { path = "../../crates/deskfuse-transport" }

quinn.workspace = true
rustls.workspace = true
rcgen = "=0.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
