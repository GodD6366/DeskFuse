[package]
name = "deskfuse-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
deskfuse-core = { path = "../../crates/deskfuse-core" }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
bincode = "1.3"
flate2 = "1"
image = { version = "0.25.9", default-features = false, features = ["tiff", "png"] }
sha2.workspace = true
deskfuse-protocol = { path = "../../crates/deskfuse-protocol" }
deskfuse-identity = { path = "../../crates/deskfuse-identity" }
deskfuse-runtime = { path = "../../crates/deskfuse-runtime" }
deskfuse-store = { path = "../../crates/deskfuse-store" }
deskfuse-transport = { path = "../../crates/deskfuse-transport" }
deskfuse-discovery = { path = "../../crates/deskfuse-discovery" }
deskfuse-platform = { path = "../../crates/deskfuse-platform" }
deskfuse-platform-windows = { path = "../../crates/deskfuse-platform-windows" }
uuid.workspace = true
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_Services", "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem"
] }

[[bin]]
name = "deskfuse-service"
path = "src/main.rs"

[[bin]]
name = "deskfuse-service-client"
path = "src/client.rs"

[[bin]]
name = "deskfuse-input-helper"
path = "src/input_helper.rs"

[lints]
workspace = true
